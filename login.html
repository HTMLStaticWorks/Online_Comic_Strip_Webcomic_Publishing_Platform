<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicVerse - Login | Online Comic Strip & Webcomic Publishing Platform</title>
    <meta name="description" content="Log in to your ComicVerse creator or reader account.">
    <!-- Bootstrap 5 CSS -->
    <link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body>

    <!-- Floating controls at top right of viewport -->
    <div class="floating-controls">
        <button class="control-btn" id="rtl-toggle" aria-label="Toggle Direction"><i class="bi bi-translate"></i></button>
        <button class="control-btn" id="theme-toggle" aria-label="Toggle Theme"><i class="bi bi-moon-fill"></i></button>
    </div>

    <!-- Centered Form Container -->
    <div class="container d-flex align-items-center justify-content-center min-vh-100 py-5">
        <div class="form-container my-0">
            <div class="text-center mb-4">
                <a href="home-1.html">
                    <img src="assets/images/logo.svg" alt="ComicVerse Logo" class="logo-img mb-3">
                </a>
                <h2 class="h3-title">Welcome Back</h2>
                <p class="caption-text">Enter your credentials to access your dashboard</p>
            </div>
            
            <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
                <div class="form-group-custom mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" required placeholder="name@example.com">
                </div>
                
                <div class="form-group-custom mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="form-input-wrapper">
                        <input type="password" class="form-control" id="password" required placeholder="••••••••">
                        <button type="button" class="password-toggle-btn" aria-label="Toggle Password Visibility">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember-me">
                        <label class="form-check-label caption-text" for="remember-me">Remember Me</label>
                    </div>
                    <a href="coming-soon.html" class="caption-text text-decoration-none">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-custom btn-primary-custom w-100 mb-3">Log In</button>
            </form>

            <div class="text-center mb-3">
                <span class="caption-text text-muted">Or log in with</span>
            </div>

            <!-- Social Logins -->
            <div class="social-login-container mb-4">
                <a href="dashboard.html" class="social-login-btn">
                    <i class="bi bi-google text-danger"></i> Google
                </a>
                <a href="dashboard.html" class="social-login-btn">
                    <i class="bi bi-apple apple-logo-icon"></i> Apple
                </a>
            </div>

            <div class="text-center">
                <p class="caption-text">Don't have an account? <a href="register.html" class="text-decoration-none">Sign Up</a></p>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="assets/js/main.js"></script>
</body>
</html>
