<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 50" width="180" height="50">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>
  <g transform="translate(5, 0)">
    <!-- Brand Typography on the left for RTL -->
    <text x="10" y="25" dominant-baseline="central" font-family="'Outfit', sans-serif" font-size="22" font-weight="700" fill="#f43f5e">ComicVerse</text>
    
    <!-- Comic Panel Frame shifted to the right -->
    <g transform="translate(130, 0)">
      <rect x="8" y="10" width="28" height="28" rx="6" stroke="url(#logo-grad)" stroke-width="3" fill="none" transform="rotate(-5 22 24)" />
      <!-- Dialogue/Comic Bubble -->
      <path d="M 16 14 H 28 C 30.2 14 32 15.8 32 18 V 26 C 32 28.2 30.2 30 28 30 H 22 L 17 34 V 30 H 16 C 13.8 30 12 28.2 12 26 V 18 C 12 15.8 13.8 14 16 14 Z" fill="url(#logo-grad)" />
      <!-- White Pencil / Sparkle inside the bubble -->
      <path d="M 18 22 L 20 20 L 24 24 L 22 26 Z" fill="#ffffff" />
      <circle cx="26" cy="19" r="1.5" fill="#ffffff" />
    </g>
  </g>
</svg>
